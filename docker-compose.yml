services:
  db:
    image: postgres:16-alpine
    container_name: assessment-db
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assessment"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: assessment-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/assessment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
